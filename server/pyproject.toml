[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.2",
    "pre-commit>=4.3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "ruff>=0.13.1",
]

[tool.pyright]
include = ["."] 
exclude = [".venv", "__pycache__", "*.pyc", ".ruff_cache"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv" 
reportMissingImports = true
reportArgumentType = true
